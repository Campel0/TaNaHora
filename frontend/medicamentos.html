<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaNaHora - Medicamentos</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="container">
    <h1>TaNaHora</h1>
    
    <nav class="menu">
      <a href="medicamentos.html" class="menu-item ativo">Remédios</a>
      <a href="notificacoes.html" class="menu-item">Avisos</a>
      <a href="historico.html" class="menu-item">Histórico</a>
      <a href="index.html" class="menu-item sair">Sair</a>
    </nav>

    <h2>Cadastro de Medicamentos</h2>

    <input id="nome" type="text" placeholder="Nome do medicamento">
    <input id="dosagem" type="text" placeholder="Dosagem (ex: 500mg)">
    <input id="intervalo" type="text" placeholder="Intervalo (ex: 8h)">
    <label for="horaInicio" style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); text-align: left; padding-left: 5px;">Horário da Primeira Dose:</label>
    <input id="horaInicio" type="time">

    <button onclick="cadastrarMedicamento()">
      Cadastrar Medicamento
    </button>

    <ul id="lista"></ul>

    <!-- Modal para Edição de Medicamentos (oculto por padrão via CSS/Style) -->
    <div id="modal-edicao" class="modal" style="display: none;">
      <div class="modal-conteudo">
        <h2>Editar Medicamento</h2>
        <!-- Input invisível para guardar o ID do medicamento que estamos editando -->
        <input id="edit-id" type="hidden">
        <input id="edit-nome" type="text" placeholder="Nome do medicamento">
        <input id="edit-dosagem" type="text" placeholder="Dosagem (ex: 500mg)">
        <input id="edit-intervalo" type="text" placeholder="Intervalo (ex: 8h)">
        <label for="edit-horaInicio" style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); text-align: left; padding-left: 5px;">Horário da Primeira Dose:</label>
        <input id="edit-horaInicio" type="time">
        
        <div class="botoes-acao">
          <button onclick="salvarEdicao()" class="btn-success">Salvar Alterações</button>
          <button onclick="fecharEdicao()" class="btn-danger">Cancelar</button>
        </div>
      </div>
    </div>

  </div>

  <script src="./js/api.js"></script>
  <script src="./js/medicamento.js"></script>

</body>
</html>
